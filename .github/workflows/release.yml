name: Build and Package Plugin

# Run via Actions → Run workflow. The tag points to a commit on branch `release`
# that contains the built blocks, so Git Updater can install the tag zipball
# without a release asset.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Version tag to create, e.g. v1.2.3'
        required: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Build blocks
        run: |
          npm ci
          npm run build

      - name: Create ZIP Deployment Package
        env:
          TAG: ${{ github.event.inputs.tag }}
        run: |
          mkdir -p dist/wp-usefull-blocks
          tar --exclude=./.git --exclude=./.github --exclude=./dist --exclude=./node_modules \
            --exclude=./src --exclude=./docs --exclude=./coverage --exclude='*.zip' \
            -cf - . | tar -xf - -C dist/wp-usefull-blocks
          cd dist && zip -qr "../wp-usefull-blocks-${TAG#v}.zip" wp-usefull-blocks

      - name: Commit build to release branch
        id: release_commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B release
          git add -f build
          git commit -q -m "Release ${{ github.event.inputs.tag }} (built)"
          git push -f origin release
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Create release with ZIP
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag }}
          target_commitish: ${{ steps.release_commit.outputs.sha }}
          files: wp-usefull-blocks-*.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
